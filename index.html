<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/notar-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="description" content="Sistema local-first para gestão de doações, conciliação NFP e abatimentos." />
    <title>Notar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Editorial Terminal type system:
         Geist        — UI principal
         IBM Plex Mono — todos os valores numéricos (ledger feel)
         Fraunces     — eyebrows editoriais (uppercase, optical 9pt) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9,500;9,600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var t = localStorage.getItem("notar-theme") || "system";
        var html = document.documentElement;
        if (t === "light") {
          html.classList.add("light");
        } else if (t === "system") {
          if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            html.classList.add("light");
          }
        }
        // "dark" → no class needed, dark is the CSS default
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
